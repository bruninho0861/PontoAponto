<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Comprovantes de Ponto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fundo personalizado com padrão de mini carteirinhas de trabalho vetorizadas */
        body {
            background-color: #1e3a8a; /* Azul forte base */
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M14 16h12v4H14v-4zm0 6h12v4H14v-4zm16-6h36v16H30V16zm4 4h28v8H34v-8zM14 36h12v4H14v-4zm0 6h12v4H14v-4zm16-6h36v16H30V36zm4 4h28v8H34v-8z'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 80px 80px;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-blue-900/90 backdrop-blur-md text-white shadow-lg p-4 sticky top-0 z-10 border-b border-blue-700/50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold flex items-center gap-2">
                <span class="bg-blue-800 p-1.5 rounded-lg shadow-inner">⏱️</span> Meu Ponto Certo
            </h1>
            <span id="total-comprovantes" class="text-xs bg-blue-800 text-blue-100 px-3 py-1 rounded-full font-semibold border border-blue-600/50">0 ativos</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow pb-24">
        
        <!-- Cartão de Ação / Envio -->
        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl border border-white/20 p-5 mb-6">
            <h2 class="text-xs uppercase tracking-wider font-bold text-blue-900 mb-3 flex items-center gap-1.5">
                <span>➕</span> Adicionar Novo Comprovante
            </h2>
            
            <form id="form-ponto" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Data</label>
                        <input type="date" id="data-ponto" required 
                               class="w-full rounded-xl border border-slate-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700 bg-slate-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo de Ponto</label>
                        <select id="tipo-ponto" required
                                class="w-full rounded-xl border border-slate-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700 bg-slate-50 font-medium">
                            <option value="Entrada">🟢 Entrada</option>
                            <option value="Saída">🔴 Saída</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Foto do Papelzinho</label>
                    <input type="file" id="foto-ponto" accept="image/*" capture="environment" required
                           class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-800 hover:file:bg-blue-100 cursor-pointer">
                    <p class="text-[10px] text-slate-400 mt-1">A imagem será otimizada automaticamente.</p>
                </div>

                <button type="submit" id="btn-salvar"
                        class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-md active:scale-[0.98]">
                    Salvar Comprovante
                </button>
            </form>
        </div>

        <!-- Seção da Lista & Filtro -->
        <div>
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs uppercase tracking-wider font-bold text-white/90 drop-shadow-sm">
                    Comprovantes Vigentes
                </h2>
                <span class="text-[11px] font-medium text-blue-200">Expiram após dia 10</span>
            </div>

            <!-- Caixa de Busca / Filtro por Data -->
            <div class="bg-white/95 backdrop-blur-sm rounded-xl p-3 mb-3 shadow-md border border-white/20 flex items-center gap-2">
                <span class="text-slate-400 text-sm">🔍</span>
                <input type="date" id="filtro-data" placeholder="Filtrar por data específica..." 
                       class="w-full bg-transparent text-xs text-slate-700 focus:outline-none font-medium">
                <button type="button" onclick="limparFiltro()" id="btn-limpar-filtro" class="hidden text-xs text-blue-700 font-semibold px-2 py-1 bg-blue-50 rounded-lg hover:bg-blue-100">Limpar</button>
            </div>

            <div id="lista-comprovantes" class="space-y-3">
                <!-- Itens inseridos via JS -->
            </div>

            <!-- Estado Vazio -->
            <div id="vazio-state" class="hidden text-center py-12 bg-white/90 backdrop-blur-sm rounded-2xl border border-dashed border-blue-300/50 shadow-md">
                <p class="text-3xl mb-2">📂</p>
                <p class="text-sm text-slate-700 font-semibold">Nenhum comprovante encontrado</p>
                <p class="text-xs text-slate-400 mt-1">Tente ajustar a busca ou envie um novo ponto.</p>
            </div>
        </div>
    </main>

    <!-- Modal de Visualização -->
    <div id="modal-imagem" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="fecharModal()" class="absolute top-4 right-4 text-white text-3xl font-light bg-white/10 w-10 h-10 rounded-full flex items-center justify-center">×</button>
        <img id="img-modal" class="max-w-full max-h-[80vh] rounded-xl object-contain mb-4 border border-white/10" src="" alt="Comprovante ampliado">
        <div id="modal-info" class="text-white text-xs font-medium text-center bg-blue-900/80 border border-blue-500/30 px-4 py-2 rounded-full shadow-lg"></div>
    </div>

    <!-- Script da Aplicação -->
    <script>
        const STORAGE_KEY = 'pontos_comprovantes_v2';

        document.getElementById('data-ponto').valueAsDate = new Date();
        let comprovantes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function calcularExpiracao(dataStr) {
            const data = new Date(dataStr + 'T00:00:00');
            let ano = data.getFullYear();
            let mes = data.getMonth() + 1;

            if (mes > 11) {
                mes = 0;
                ano++;
            }
            return new Date(ano, mes, 10);
        }

        function filtrarValidos() {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            comprovantes = comprovantes.filter(item => {
                const expiracao = new Date(item.expiracao);
                return expiracao >= hoje;
            });
            salvarStorage();
        }

        function salvarStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(comprovantes));
        }

        function comprimirImagem(file, maxWidth = 1000, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderizar() {
            filtrarValidos();
            const listaEl = document.getElementById('lista-comprovantes');
            const vazioEl = document.getElementById('vazio-state');
            const totalEl = document.getElementById('total-comprovantes');
            const filtroData = document.getElementById('filtro-data').value;
            const btnLimpar = document.getElementById('btn-limpar-filtro');

            if (filtroData) {
                btnLimpar.classList.remove('hidden');
            } else {
                btnLimpar.classList.add('hidden');
            }

            // Filtragem por data selecionada na caixa de busca
            let listaFiltrada = comprovantes;
            if (filtroData) {
                listaFiltrada = comprovantes.filter(item => item.data === filtroData);
            }

            listaEl.innerHTML = '';
            totalEl.innerText = `${comprovantes.length} ${comprovantes.length === 1 ? 'ativo' : 'ativos'}`;

            if (listaFiltrada.length === 0) {
                vazioEl.classList.remove('hidden');
                return;
            }

            vazioEl.classList.add('hidden');
            listaFiltrada.sort((a, b) => new Date(b.data) - new Date(a.data));

            listaFiltrada.forEach((item) => {
                const dataFormatada = new Date(item.data + 'T00:00:00').toLocaleDateString('pt-BR');
                const expFormatada = new Date(item.expiracao).toLocaleDateString('pt-BR');
                const tipoBadgeColor = item.tipo === 'Entrada' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-rose-100 text-rose-800 border-rose-200';

                const card = document.createElement('div');
                card.className = 'bg-white/95 backdrop-blur-sm rounded-2xl p-3 shadow-md border border-white/20 flex items-center justify-between gap-3';

                card.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-grow" onclick="abrirModal('${item.imagem}', '${dataFormatada} (${item.tipo})', '${expFormatada}')">
                        <img src="${item.imagem}" class="w-14 h-14 object-cover rounded-xl border border-slate-200 flex-shrink-0 shadow-sm" alt="Miniatura ponto">
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-xs font-bold text-slate-800">${dataFormatada}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${tipoBadgeColor}">${item.tipo}</span>
                            </div>
                            <p class="text-[11px] text-slate-500">Expira em: ${expFormatada}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="abrirModal('${item.imagem}', '${dataFormatada} (${item.tipo})', '${expFormatada}')" class="p-2 text-slate-400 hover:text-blue-700 rounded-lg transition" title="Ver imagem">
                            🔍
                        </button>
                        <button onclick="excluirItem(${item.id})" class="p-2 text-slate-400 hover:text-red-500 rounded-lg transition" title="Excluir">
                            🗑️
                        </button>
                    </div>
                `;
                listaEl.appendChild(card);
            });
        }

        document.getElementById('filtro-data').addEventListener('input', renderizar);

        function limparFiltro() {
            document.getElementById('filtro-data').value = '';
            renderizar();
        }

        document.getElementById('form-ponto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const inputData = document.getElementById('data-ponto').value;
            const inputTipo = document.getElementById('tipo-ponto').value;
            const inputFile = document.getElementById('foto-ponto').files[0];

            if (!inputFile || !inputData) return;

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.innerText = 'Processando e compactando...';
            btnSalvar.disabled = true;

            try {
                const imagemOtimizada = await comprimirImagem(inputFile);
                const dataExpiracao = calcularExpiracao(inputData);

                const novoComprovante = {
                    id: Date.now(),
                    data: inputData,
                    tipo: inputTipo,
                    expiracao: dataExpiracao.toISOString(),
                    imagem: imagemOtimizada
                };

                comprovantes.push(novoComprovante);
                salvarStorage();
                renderizar();

                document.getElementById('foto-ponto').value = '';
            } catch (erro) {
                alert('Erro ao processar a imagem. Tente novamente.');
                console.error(erro);
            } finally {
                btnSalvar.innerText = 'Salvar Comprovante';
                btnSalvar.disabled = false;
            }
        });

        function excluirItem(id) {
            if (confirm('Deseja realmente excluir este comprovante?')) {
                comprovantes = comprovantes.filter(item => item.id !== id);
                salvarStorage();
                renderizar();
            }
        }

        function abrirModal(src, info, exp) {
            document.getElementById('img-modal').src = src;
            document.getElementById('modal-info').innerText = `${info} | Válido até: ${exp}`;
            document.getElementById('modal-imagem').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal-imagem').classList.add('hidden');
        }

        renderizar();
    </script>
</body>
</html>
